ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # wheel/odom comes from the DiffDrive plugin via ros_gz_bridge
    odom0: wheel/odom
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  false,  false,
                   false, false, true,
                   false, false, false]

    # imu/data comes from imu_filter_madgwick processing /imu/data_raw
    # (WitMotion IMU sensor bridged from Gazebo, same pipeline as hardware)
    imu0: imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]

              #  [X, Y, Z,
              #   roll, pitch, yaw,
              #   Vx, Vy, Vz,
              #   vroll, vpitch, vyaw,
              #   ax, ay, az]

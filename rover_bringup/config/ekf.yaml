ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true  # 2D plane (floor) assumption
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: wheel/odom
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  false,  false,
                   false, false, true,
                   false, false, false]

    imu0: imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]

              #  [X, Y, Z,
              #   roll, pitch, yaw,
              #   Vx, Vy, Vz,
              #   vroll, vpitch, vyaw,
              #   ax, ay, az]

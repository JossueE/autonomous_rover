ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true  # 2D plane (floor) assumption
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: wheel/odom
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  false,  false,
                   false, false, true,
                   false, false, false]

    imu0: imu/data
    # El WitMotion actualmente no publica angular_velocity (gyro), por lo que
    # Madgwick produce un yaw arbitrario y fijo. Tratamos el yaw como
    # diferencial para que el EKF parta con yaw=0 alineado con el robot,
    # y el vyaw del wheel odom sea quien construya la rotación.
    imu0_differential: true
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]

              #  [X, Y, Z,
              #   roll, pitch, yaw,
              #   Vx, Vy, Vz,
              #   vroll, vpitch, vyaw,
              #   ax, ay, az]

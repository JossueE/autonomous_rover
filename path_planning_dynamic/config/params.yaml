path_planning_node:
  ros__parameters:
    kinematics.model: "differential"     # Selectable model: ackermann or differential.
    vehicle.axle_to_front: 0.20      # Distance from robot center to the front footprint using the minibase chassis length (0.55 m).
    vehicle.axle_to_back: 0.20       # Distance from robot center to the rear footprint using the minibase chassis length (0.55 m).
    vehicle.width: 0.25              # Total vehicle width including wheel thickness and separation from the minibase URDF.
    planner.segment_steps: 5          # Number of rollout samples per motion primitive.
    planner.sample_distance: 0.05     # Distance advanced per rollout sample for forward primitives (m).
    planner.square_size_m: 1.5        # Side length of the local planning window used for local occupancy reconstruction (m).
    planner.safe_clear: 0.2           # Minimum clearance margin to obstacles used by the planner cost/rejection logic (m).
    planner.goal_tolerance: 0.4       # Arrival radius for the navigate action's goal-reached check (m). Separate from safe_clear.
    planner.obstacle_inflation_radius_cells: 0 # [LEGACY, fallback only] Extra obstacle inflation radius in local-grid cells. Used only when planner.obstacle_inflation_radius_m <= 0.
    planner.obstacle_inflation_radius_m: 0.0 # Disabled to preserve old cell-based obstacle inflation behavior.
    planner.forward_distance: 1.5     # Distance (m) the local chunk origin is shifted ahead of the robot along its heading.
    planner.chunk_radius_cells: 200    # Half-side of the local chunk extracted from the global map, in cells of the global map. Total chunk = (2*radius) x (2*radius) cells.
    planner.scale_factor: 1.0         # Rescale factor for the local chunk. >1: more cells, smaller resolution; <1: fewer cells, larger resolution. The rescaled resolution is global_planner_resolution / scale_factor.
    ackermann.wheelbase: 0.08         # Distance between front and rear axle (m).
    ackermann.max_steering_angle: 0.1 # Maximum steering angle of the front wheels (rad).
    differential.linear_step: 0.05    # Forward distance per rollout sample for moving differential primitives (m).
    differential.max_angular_step: 0.1 # Heading increment per rollout sample for differential primitives (rad).
    differential.angular_samples: 5   # Number of moving angular samples for the differential model.
    differential.include_in_place_rotation: true # Adds pure rotation primitives for the differential model.
    tree_depth: 7                     # Maximum depth of the A* search tree for local path planning.
    branching_factor: 5               # Number of possible branches (actions/commands) per tree level.
    map_path: package://rover_bringup/maps/test_706.osm # Path to the Lanelet2 (.osm) map file.
    start_lanelet_id: 65             # Fallback ID of the starting lanelet for the global planner.
    end_lanelet_id: 37                # Fallback ID of the goal lanelet for the global planner.
    start_lanelet_name: ""    # Preferred .osm lanelet tag name. Empty string falls back to start_lanelet_id.

    # 37: estación1
    # 59: repiza
    # 65: inicio
    # 93: fin
    # 104: banda

    end_lanelet_name: ""          # Preferred .osm lanelet tag name. Empty string falls back to end_lanelet_id.
    x_offset: 0.0                     # X offset to align map and robot frame (m).
    y_offset: 0.0                     # Y offset to align map and robot frame (m).
    z_offset: -2.10                   # Z offset applied to TF pose to match lanelet map z projection. Was hardcoded -2.10 in source.
    pose_frame: "base_footprint"      # TF frame used to estimate the planner pose in the map frame.
    global_planner_resolution: 0.05         # Resolution of the global planner grid (m).
    global_planner_close_radius: 1         # Radius around the robot to consider as "close" for the global planner (m).
    global_planner_close_iters: 1          # Number of iterations for close-range global planning.
    global_planner_outside_value: 100   # Cost value for outside the drivable area in the global planner.
    global_planner_frame_id: "map"         # Frame ID for the global planner occupancy grid.
    global_planner_occupancy_output_topic: "/global_planner_occupancy_grid" # Topic to publish the occupancy grid.

pointcloud_clustering_node:
  ros__parameters:
    CLUSTER_THRESH: 0.35          # Maximum distance between points to belong to the same cluster (m). Increased for dense raw Kinect clouds.
    CLUSTER_MAX_SIZE: 60000      # Raised from 8000 - raw Kinect clusters easily exceed 8k pts, causing all clusters to be silently dropped.
    CLUSTER_MIN_SIZE: 20          # Slightly higher to reject noise specks while still catching real obstacles.
    HULL_MODE: "concave"          # Hull generation mode: "convex" or "concave".
    CONCAVE_ALPHA: 0.25          # Looser concave hull: faster computation and fewer degenerate vertices on dense indoor clouds.
    FRAME_ID : "base_footprint"       # Reference frame for published clustering results.

pointcloud_roi_node:
  ros__parameters:
    name_space: "robot_footprint"        # Namespace for topics/objects related to the robot footprint.
    frame_id: "depth_camera_link"                # Frame in which ROI and footprint are defined.
    pointcloud_topic: "/k4a/points2"         # Input topic of the converted LiDAR point cloud with ROS TF frame IDs.
    output_topic: "/points_rotated"               # Output topic for filtered/rotated point cloud (full ROI).
    output_topic_ground: "/points_rotated_notground"  # Output topic for non-ground points.
    sensor_rotation_y_: 0.0              # Sensor rotation around Y axis (rad). Compensates LiDAR tilt.
    voxel_condition: true                # Downsample ROI before clustering.
    ground_filter_condition: false       # SVD ground fitting assumes Z=up; Kinect optical frame uses Z=depth.
    roi_max_x_: 2.0                      # Reduced from 10m - indoor rooms don't need 10m forward range; halves point count.
    roi_max_y_: 0.20                     # Kinect optical frame: Y=down. Floor is at Y~=+0.48m (sensor height). Tighter lower cap to keep the floor out of the obstacle pipeline.
    roi_max_z_: 2.0                      # Kinect optical frame: Z=depth. Extended far depth range to see farther obstacles.
    roi_min_x_: -1.6                     # Lateral left limit (m).
    roi_min_y_: -0.4                     # Ceiling/upward limit - Y<0 is above camera in optical frame.
    roi_min_z_: 0.3                   # Minimum depth (m) - ignore points closer than 20cm to avoid camera noise.
    voxel_leaf_size_x: 0.05            # 5 cm voxel - reduces 95k raw pts to ~3-8k while preserving obstacle shape.
    voxel_leaf_size_y: 0.05            # 5 cm voxel - reduces 95k raw pts to ~3-8k while preserving obstacle shape.
    voxel_leaf_size_z: 0.05
    num_lpr_: 200                        # Reduced from 400 - sufficient seed points after voxel downsampling.
    th_seeds_: 0.2                       # Tighter seed window vs 0.3 - cleaner initial ground plane estimate.
    th_dist_: 0.12                       # (unused while voxel_condition=false) distance threshold above ground plane.
    sensor_height_: 0.48                 # Sensor height above the ground (m).
    robot_footprint_x_max: 0.20         # Robot footprint max X from the minibase chassis half-length.
    robot_footprint_y_max: 0.20          # Robot footprint max Y including wheel outer width from the minibase URDF.
    robot_footprint_z_max: 0.1          # Robot footprint max Z (upward extent, m).
    robot_footprint_x_min: -0.20        # Robot footprint min X from the minibase chassis half-length.
    robot_footprint_y_min: -0.20         # Robot footprint min Y including wheel outer width from the minibase URDF.
    robot_footprint_z_min: -0.1          # Robot footprint min Z (downward extent, m).
    robot_footprint_topic: "/robot_footprint_polygon"  # Topic where the robot footprint polygon is published.
